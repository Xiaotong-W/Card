# Workflow for deploying static content from 'card_gacha_web/template' to GitHub Pages
name: Deploy card_gacha_web to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # 仅上传 card_gacha_web/template/ 作为 GitHub Pages 部署目录
      - name: Upload artifact from 'card_gacha_web/template'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'card_gacha_web/template/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
