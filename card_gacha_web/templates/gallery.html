<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡牌画廊</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>我的卡牌画廊</h1>

    <div class="card-gallery">
        {% for rarity, cards in all_cards.items() %}
            <h2>{{ rarity }}</h2>
            <div class="cards">
                {% for card_name, card_img in cards %}
                    <div class="card {% if card_name in owned_cards %} {{ rarity.lower() }} {% else %} gray {% endif %}">  <!-- 根据稀有度添加类 -->

                        {% if card_name in owned_cards %}
                            <img src="{{ card_img }}" alt="{{ card_name }}" class="card-img">
                        {% else %}
                            <img src="{{ url_for('static', filename='grey.png') }}" alt="{{ card_name }}" class="card-img">
                        {% endif %}
                    </div>
                {% endfor %}
            </div>
        {% endfor %}
    </div>

    <a href="/"><button>返回首页</button></a>
</body>
</html>
